# ══════════════════════════════════════════════════════════════════════════
#  MixCoach CI — GitHub Actions
#
#  Ejecuta en cada push y PR:
#    1. Configura CMake con Visual Studio 17 2022
#    2. Build de MixCoach_VST3 + Messenger_VST3
#    3. Pattern validator + tests via quick_validate.ps1
#    4. Upload de artefactos VST3 en master
#
#  Requisitos:
#    - JUCE 8+ como submodule en libs/JUCE (o vía variable JUCE_PATH en GitHub Settings → Variables)
#
#  Nota: windows-2022 tiene VS 2022 pre-instalado.
#  jwlawson/setup-cmake instala CMake recent para compatibilidad con VS 17 2022.
#
#  ══════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [ "master", "main", "develop" ]
    paths-ignore:
      - '**.md'
      - 'workspace_memory/**'
      - 'knowledge/**'
  pull_request:
    branches: [ "master", "main" ]
    paths-ignore:
      - '**.md'
      - 'workspace_memory/**'

env:
  BUILD_TYPE: Release
  # ─── Ruta a JUCE ──────────────────────────────────────────────────────
  # Configurable via GitHub Actions variable (Settings → Variables)
  # o via submodule en libs/JUCE
  JUCE_ROOT: ${{ vars.JUCE_PATH || 'libs/JUCE' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      # ─── Paso 1: Checkout del repositorio ────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ─── Paso 2: Setup CMake (versión reciente) ──────────────────────
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.x'

      # ─── Paso 3: Verificar JUCE ──────────────────────────────────────
      - name: Check JUCE availability
        shell: pwsh
        run: |
          $juceRoot = "${{ env.JUCE_ROOT }}"
          Write-Host "JUCE_ROOT: $juceRoot"
          if (Test-Path "$juceRoot/CMakeLists.txt") {
            Write-Host "  ✅ JUCE encontrado en: $juceRoot" -ForegroundColor Green
          } else {
            Write-Host "  ⚠️  JUCE no encontrado en: $juceRoot" -ForegroundColor Yellow
            Write-Host "  → Opciones:" -ForegroundColor Yellow
            Write-Host "    1. Agrega JUCE como submodule: git submodule add https://github.com/juce-framework/JUCE.git libs/JUCE" -ForegroundColor Yellow
            Write-Host "    2. Setea variable JUCE_PATH en GitHub: Settings → Secrets and variables → Actions → Variables" -ForegroundColor Yellow
            Write-Host "    3. Usa un self-hosted runner con JUCE instalado" -ForegroundColor Yellow
            exit 1
          }

      # ─── Paso 4: Configure + Build MixCoach + tests (mismo shell cmd) ─
      # vcvarsall.bat preservado para que MSBuild funcione.
      - name: Configure + Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=%BUILD_TYPE% -DJUCE_ROOT=%JUCE_ROOT%
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%
          cmake --build build --config %BUILD_TYPE% --target MixCoach_VST3 --target TestCoachEngine --target TestPhaseManager --target TestSemanticComparator --target TestTrackFeedCore --target TestSmoothValue --target TestExperienceLevel --target TestAudioAnalyzer --target TestAudioDescriptors --target TestSlotRegistry --target TestSharedMemory --target TestIPCIntegration --target TestLUFSMeter --target TestSpectralBands --target TestSpectrographComponent --target TestVectorscopeComponent --target TestPhaseCorrelationMeter --target TestStereoWidthMeter --target TestReferenceAudioPlayer --target TestMixPriorityEngine --target TestExpectedProfiles --target TestGenreProfiles --target TestChatBubbleHeight --target TestDifferenceProfile --target TestMixScore --target TestStress50Tracks --target TestStress128Slots -- /nologo /maxcpucount:2
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%

      # ─── Paso 5: Run tests ─────────────────────────────────────────
      - name: Run tests
        shell: pwsh
        run: |
          $testExeDir = "build/tests/Release"
          if (-not (Test-Path $testExeDir)) { $testExeDir = "build/tests" }
          $tests = @(
            "TestCoachEngine","TestPhaseManager","TestSemanticComparator",
            "TestTrackFeedCore","TestSmoothValue","TestExperienceLevel",
            "TestAudioAnalyzer","TestAudioDescriptors","TestSlotRegistry",
            "TestSharedMemory","TestIPCIntegration","TestLUFSMeter",
            "TestSpectralBands","TestSpectrographComponent","TestVectorscopeComponent",
            "TestPhaseCorrelationMeter","TestStereoWidthMeter",
            "TestReferenceAudioPlayer","TestMixPriorityEngine",
            "TestExpectedProfiles","TestGenreProfiles","TestChatBubbleHeight","TestDifferenceProfile","TestMixScore"
          )
          $pass = 0; $fail = 0; $skip = 0
          foreach ($test in $tests) {
            $exe = Join-Path $testExeDir "$test.exe"
            if (-not (Test-Path $exe)) {
              Write-Host "  [?] $test.exe not found (SKIP)" -ForegroundColor Yellow
              $skip++
              continue
            }
            Write-Host "  Running $test..." -ForegroundColor Gray
            $output = & $exe 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "  [PASS] $test" -ForegroundColor Green
              $pass++
            } else {
              Write-Host "  [FAIL] $test" -ForegroundColor Red
              $output | Select-String "FAIL|failed|Error|Results" | Select-Object -First 5 | ForEach-Object { Write-Host "    $_" -ForegroundColor Red }
              $fail++
            }
          }
          Write-Host ""
          Write-Host "  Pass: $pass  |  Fail: $fail  |  Skip: $skip" -ForegroundColor $(if($fail -gt 0){"Red"}else{"Green"})
          if ($fail -gt 0) { exit 1 }

      # ─── Paso 6: Run stress tests (ya build desde paso 4) ────────────
      - name: Run stress tests
        shell: pwsh
        run: |
          $tests = @("TestStress50Tracks", "TestStress128Slots")
          $failed = 0
          foreach ($test in $tests) {
            $exe = "build/tests/Release/$test.exe"
            if (-not (Test-Path $exe)) { $exe = "build/tests/$test.exe" }
            if (-not (Test-Path $exe)) {
              Write-Host "  [?] $test.exe not found (SKIP)" -ForegroundColor Yellow
              continue
            }
            Write-Host "  Running $test..." -ForegroundColor Gray
            $output = & $exe 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "  [PASS] $test" -ForegroundColor Green
            } else {
              Write-Host "  [FAIL] $test" -ForegroundColor Red
              $output | Select-String "FAIL|failed|Results" | Select-Object -First 3 | ForEach-Object { Write-Host "    $_" -ForegroundColor Red }
              $failed++
            }
          }
          if ($failed -gt 0) { exit 1 }

      # ─── Paso 8: Upload VST3 artifacts (solo en master) ────────────
      - name: Upload VST3 artifacts
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: MixCoach-VST3-${{ github.sha }}
          path: |
            build/MixCoach_artefacts/Release/VST3/
            build/Messenger_artefacts/Release/VST3/
          if-no-files-found: warn
          retention-days: 7
