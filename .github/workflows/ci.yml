# ══════════════════════════════════════════════════════════════════════════
#  MixCoach CI — GitHub Actions
#
#  Ejecuta en cada push y PR:
#    1. Configura CMake con Visual Studio 17 2022
#    2. Build de MixCoach_VST3 + Messenger_VST3
#    3. Pattern validator + tests via quick_validate.ps1
#    4. Upload de artefactos VST3 en master
#
#  Requisitos:
#    - JUCE 8+ como submodule en libs/JUCE (o vía variable JUCE_PATH en GitHub Settings → Variables)
#
#  Nota: windows-2022 tiene VS 2022 pre-instalado.
#  jwlawson/setup-cmake instala CMake recent para compatibilidad con VS 17 2022.
#
#  ══════════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [ "master", "main", "develop" ]
    paths-ignore:
      - '**.md'
      - 'workspace_memory/**'
      - 'knowledge/**'
  pull_request:
    branches: [ "master", "main" ]
    paths-ignore:
      - '**.md'
      - 'workspace_memory/**'

env:
  BUILD_TYPE: Release
  # ─── Ruta a JUCE ──────────────────────────────────────────────────────
  # Configurable via GitHub Actions variable (Settings → Variables)
  # o via submodule en libs/JUCE
  JUCE_ROOT: ${{ vars.JUCE_PATH || 'libs/JUCE' }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      # ─── Paso 1: Checkout del repositorio ────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ─── Paso 2: Setup CMake (versión reciente) ──────────────────────
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.x'

      # ─── Paso 3: Verificar JUCE ──────────────────────────────────────
      - name: Check JUCE availability
        shell: pwsh
        run: |
          $juceRoot = "${{ env.JUCE_ROOT }}"
          Write-Host "JUCE_ROOT: $juceRoot"
          if (Test-Path "$juceRoot/CMakeLists.txt") {
            Write-Host "  ✅ JUCE encontrado en: $juceRoot" -ForegroundColor Green
          } else {
            Write-Host "  ⚠️  JUCE no encontrado en: $juceRoot" -ForegroundColor Yellow
            Write-Host "  → Opciones:" -ForegroundColor Yellow
            Write-Host "    1. Agrega JUCE como submodule: git submodule add https://github.com/juce-framework/JUCE.git libs/JUCE" -ForegroundColor Yellow
            Write-Host "    2. Setea variable JUCE_PATH en GitHub: Settings → Secrets and variables → Actions → Variables" -ForegroundColor Yellow
            Write-Host "    3. Usa un self-hosted runner con JUCE instalado" -ForegroundColor Yellow
            exit 1
          }

      # ─── Paso 4: Configure + Build MixCoach + tests (mismo shell cmd) ─
      # vcvarsall.bat preservado para que MSBuild funcione.
      - name: Configure + Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=%BUILD_TYPE% -DJUCE_ROOT=%JUCE_ROOT%
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%
          cmake --build build --config %BUILD_TYPE% --target MixCoach_VST3 --target Messenger_VST3 --target TestSmoothValue --target TestLlmCommandInterpreter --target TestCoachingNarrativeTypes --target TestPhaseManager --target TestSlotRegistry --target TestNavigationAnimations --target TestCoachingGuideWidget --target TestChatInlineCards --target TestMixBotComponent --target TestMixMapDetailPanel --target TestSessionTransitions --target TestCoachEngine --target TestTrackFeedCore --target TestTrackAnalyzerCore --target TestSemanticComparator --target TestMixPriorityEngine --target TestMixScore --target TestExpectedProfiles --target TestGenreProfiles --target TestDifferenceProfile --target TestExperienceLevel --target TestReferenceAudioPlayer --target TestAudioAnalyzer --target TestAudioDescriptors --target TestLUFSMeter --target TestSpectralBands --target TestSpectrographComponent --target TestVectorscopeComponent --target TestPhaseCorrelationMeter --target TestStereoWidthMeter --target TestSharedMemory --target TestIPCIntegration --target TestStress50Tracks --target TestStress128Slots -- /nologo /maxcpucount:2
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%

      # ─── Paso 4b: Run linters ────────────────────────────────────────
      - name: Validate REGLAS DE USO vs REGLAS DE ORO consistency
        shell: pwsh
        run: |
          Write-Host "Running rules consistency linter..." -ForegroundColor Cyan
          $output = python scripts/validate_rules_consistency.py 2>&1
          Write-Host $output
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[FAIL] Rules consistency check failed" -ForegroundColor Red
            exit 1
          }
          Write-Host "[PASS] Rules are consistent" -ForegroundColor Green

      - name: Validate all 14 actions have CUANDO USAR section
        shell: pwsh
        run: |
          Write-Host "Running action coverage linter..." -ForegroundColor Cyan
          $output = python scripts/validate_action_coverage.py 2>&1
          Write-Host $output
          if ($LASTEXITCODE -ne 0) {
            Write-Host "[FAIL] Action coverage check failed" -ForegroundColor Red
            exit 1
          }
          Write-Host "[PASS] All actions have CUANDO USAR sections" -ForegroundColor Green

      # ─── Paso 5: Run ALL tests via run_all_tests.ps1 🔬 ─────────────
      # El script usa Start-Process (evita bugs de cmd.exe → bash),
      # mide tiempos de ejecución, parsea resultados de cada test,
      # y reporta en formato GitHub Actions (::error::, ::notice::).
      - name: Run all tests
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/run_all_tests.ps1 -TestDir build/tests/Release -GHActions

      # ─── Paso 8: Upload VST3 artifacts (solo en master) ────────────
      - name: Upload VST3 artifacts
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: MixCoach-VST3-${{ github.sha }}
          path: |
            build/MixCoach_artefacts/Release/VST3/
            build/Messenger_artefacts/Release/VST3/
          if-no-files-found: warn
          retention-days: 7
