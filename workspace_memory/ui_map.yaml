# UI Map — MixCoach & Messenger
# Formato: componente -> archivo -> responsabilidad

MixCoach:
  editor_window:
    file: "Source/MixCoach/core/PluginEditor.h"
    description: "Ventana principal del plugin MixCoach"
    contains:
      - MainTabbedComponent (panel central con tabs)
      - TrackDashboardComponent (panel derecho)

  tabs:
    - id: 0
      label: "Coach Chat"
      component: "CoachChatComponent"
      file: "Source/MixCoach/ui/CoachChatComponent.h"
      description: "Chat con el mentor IA + lista de mensajes"
      subcomponents:
        - Mensaje del coach (texto, tipo, timestamp)
        - Input de usuario
        - Botones de comandos rápidos

    - id: 1
      label: "Analyzers"
      component: "AnalyzersPanelComponent"
      file: "Source/MixCoach/ui/AnalyzersPanelComponent.h"
      description: "Panel de analizadores en tiempo real"
      subcomponents:
        - ProfessionalAnalyzersComponent (espectro, fase, VU)
        - Selector de pista activa

    - id: 2
      label: "Tracks"
      component: "VirtualBusesComponent"
      file: "Source/MixCoach/ui/VirtualBusesComponent.h"
      description: "Gestión de pistas y buses virtuales"
      subcomponents:
        - Lista de pistas activas
        - Asignación de colores
        - Grupos de bus

    - id: 3
      label: "References"
      component: "ReferencePanelComponent"
      file: "Source/MixCoach/ui/ReferencePanelComponent.h"
      description: "Pistas de referencia y comparación A/B"

  track_dashboard:
    component: "TrackDashboardComponent"
    file: "Source/MixCoach/ui/TrackDashboardComponent.h"
    description: "Dashboard lateral con métricas de pista activa"
    shows:
      - Peak (L/R)
      - RMS (L/R)
      - Crest Factor
      - Correlación
      - LUFS (momentary, short-term, integrated)

  theme:
    file: "Source/MixCoach/ui/MixCoachTheme.h"
    description: "Tema visual con colores, fuentes y estilos"
    defines:
      - Colores de bus (Drums, Bass, Vocals, etc.)
      - Colores de fase de mentoría
      - LookAndFeel personalizado JUCE

  analyzers_detail:
    file: "Source/MixCoach/ui/ProfessionalAnalyzersComponent.h"
    description: "Analizadores profesionales detallados"
    contains:
      - SpectrumAnalyzer (espectro FFT con bandas de frecuencia)
      - PhaseCorrelationMeter (correlación estéreo)
      - VUMeter (VU + PPM + RMS)
      - StereoField (vectorscope)

Messenger:
  editor_window:
    file: "Source/Messenger/ui/PluginEditor.h"
    description: "UI compacta por pista"
    contains:
      - Track name input
      - Color picker
      - Bus selector
      - VU Meter
      - Waveform display
      - Botón "Enviar a MixCoach"
